<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar</button>
  </fieldset>

  <h2>Doações disponíveis</h2>
  <label for="ong">Sua ONG (obrigatório para aceitar)</label>
  <input id="ong" placeholder="Ex.: ONG Bairro Alegre">
  <ul id="lista"></ul>

  <h2>Aguardando coleta</h2>
  <ul id="aceitas"></ul>

  <fieldset>
    <legend>Relatório do mês</legend>
    <label for="mes">Mês</label>
    <input id="mes" type="month">
    <button id="gerarRelatorio">Ver relatório</button>
    <p id="relatorio"></p>
  </fieldset>

  <script>
    async function carregar() {
      const res = await fetch('/api/doacoes');
      const doacoes = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Aceitar';
        botao.onclick = async () => {
          const ong = document.getElementById('ong').value.trim();
          if (!ong) {
            alert('Informe o nome da sua ONG antes de aceitar.');
            return;
          }
          const res = await fetch(`/api/doacoes/${d.id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong })
          });
          if (!res.ok) alert((await res.json()).erro);
          carregar();
        };
        li.appendChild(botao);
        lista.appendChild(li);
      }
      carregarAceitas();
    }

    // Voluntário: confirma a coleta em um toque. O horário enviado é o do toque (evento),
    // mesmo que a conexão instável faça o envio chegar depois.
    async function carregarAceitas() {
      const res = await fetch('/api/doacoes/aceitas');
      const doacoes = await res.json();
      const lista = document.getElementById('aceitas');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação aguardando coleta.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (aceita por ${d.ong}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Coletada';
        botao.onclick = async () => {
          await fetch(`/api/doacoes/${d.id}/coletar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ coletada_em: new Date().toISOString() })
          });
          carregar();
        };
        li.appendChild(botao);
        lista.appendChild(li);
      }
    }

    document.getElementById('publicar').onclick = async () => {
      await fetch('/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: document.getElementById('tipo').value,
          quantidade: document.getElementById('quantidade').value,
          validade: document.getElementById('validade').value
        })
      });
      carregar();
    };

    // Marta: doações coletadas no mês, por ONG, e o tempo típico da publicação à coleta.
    document.getElementById('gerarRelatorio').onclick = async () => {
      const mes = document.getElementById('mes').value;
      const res = await fetch(`/api/relatorios/mensal?mes=${encodeURIComponent(mes)}`);
      const r = await res.json();
      const saida = document.getElementById('relatorio');
      if (!res.ok) { saida.textContent = r.erro; return; }
      const ongs = Object.entries(r.por_ong).map(([ong, n]) => `${ong}: ${n}`).join(', ');
      saida.textContent = `${r.coletadas} doações coletadas` +
        (ongs ? ` (${ongs})` : '') +
        (r.mediana_horas_publicacao_ate_coleta !== null
          ? ` · mediana de ${r.mediana_horas_publicacao_ate_coleta} h da publicação à coleta`
          : '');
    };

    carregar();
  </script>
</body>
</html>
